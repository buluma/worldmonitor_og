# =============================================================================
# World Monitor — Docker / Podman Compose
# =============================================================================
# Self-contained stack: app + Redis + AIS relay.
#
# Quick start:
#   cp .env.example .env        # add your API keys
#   docker compose up -d --build
#
# The app will be available at http://localhost:3000
# =============================================================================

services:
  worldmonitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: worldmonitor:latest
    container_name: worldmonitor
    ports:
      - "${WM_PORT:-3000}:8080"
    env_file:
      - .env.local
    environment:
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:-wm-local-token}"
      LOCAL_API_PORT: "46123"
      LOCAL_API_MODE: "docker"
      WM_SELF_HOSTED: "1"
      LOCAL_API_CLOUD_FALLBACK: "false"
      WS_RELAY_URL: "http://ais-relay:3004"
    # Docker secrets (recommended for API keys — keeps them out of docker inspect).
    # Create secrets/ dir with one file per key, then uncomment below.
    # See SELF_HOSTING.md or docker-compose.override.yml for details.
    # secrets:
    #   - GROQ_API_KEY
    #   - AISSTREAM_API_KEY
    #   - FINNHUB_API_KEY
    #   - FRED_API_KEY
    #   - NASA_FIRMS_API_KEY
    #   - LLM_API_KEY
    depends_on:
      redis-rest:
        condition: service_started
      ais-relay:
        condition: service_started
    restart: unless-stopped

  ais-relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    image: worldmonitor-ais-relay:latest
    container_name: worldmonitor-ais-relay
    env_file:
      - .env.local
    environment:
      PORT: "3004"
    restart: unless-stopped

  redis:
    image: docker.io/redis:7-alpine
    container_name: worldmonitor-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped

  redis-rest:
    build:
      context: docker
      dockerfile: Dockerfile.redis-rest
    image: worldmonitor-redis-rest:latest
    container_name: worldmonitor-redis-rest
    ports:
      - "127.0.0.1:8079:80"
    env_file:
      - .env.local
    environment:
      SRH_TOKEN: "${REDIS_TOKEN:-wm-local-token}"
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      - redis
    restart: unless-stopped

  seed-runner:
    build:
      context: .
      dockerfile: Dockerfile.seeder
    image: worldmonitor-seeder:latest
    container_name: worldmonitor-seeder
    profiles:
      - scheduler
    env_file:
      - .env.local
    environment:
      TZ: "${TZ:-UTC}"
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:-wm-local-token}"
      WM_APP_URL: "http://worldmonitor:8080"
      WM_RPC_BASE_URL: "http://worldmonitor:8080"
      WM_CRON_LOG_FILE: "/tmp/wm-seeders.log"
      SEEDER_TIMEOUT_SEC: "${SEEDER_TIMEOUT_SEC:-900}"
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      worldmonitor:
        condition: service_started
      redis-rest:
        condition: service_started
    restart: unless-stopped
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.frequent.schedule: "0 */15 * * * *"
      ofelia.job-exec.frequent.command: "/app/scripts/wm-cron-seeder.sh frequent"
      ofelia.job-exec.frequent.no-overlap: "true"
      ofelia.job-exec.hourly.schedule: "0 7 * * * *"
      ofelia.job-exec.hourly.command: "/app/scripts/wm-cron-seeder.sh hourly"
      ofelia.job-exec.hourly.no-overlap: "true"
      ofelia.job-exec.sixhourly.schedule: "0 17 */6 * * *"
      ofelia.job-exec.sixhourly.command: "/app/scripts/wm-cron-seeder.sh sixhourly"
      ofelia.job-exec.sixhourly.no-overlap: "true"
      ofelia.job-exec.daily.schedule: "0 32 2 * * *"
      ofelia.job-exec.daily.command: "/app/scripts/wm-cron-seeder.sh daily"
      ofelia.job-exec.daily.no-overlap: "true"
      ofelia.job-exec.weekly.schedule: "0 45 3 * * 6"
      ofelia.job-exec.weekly.command: "/app/scripts/wm-cron-seeder.sh weekly"
      ofelia.job-exec.weekly.no-overlap: "true"

  scheduler:
    image: mcuadros/ofelia:latest
    container_name: worldmonitor-scheduler
    profiles:
      - scheduler
    command: ["daemon", "--docker"]
    environment:
      TZ: "${TZ:-UTC}"
    depends_on:
      seed-runner:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

# Docker secrets — uncomment and point to your secret files.
# Example: echo "gsk_abc123" > secrets/groq_api_key.txt
# secrets:
#   GROQ_API_KEY:
#     file: ./secrets/groq_api_key.txt
#   AISSTREAM_API_KEY:
#     file: ./secrets/aisstream_api_key.txt
#   FINNHUB_API_KEY:
#     file: ./secrets/finnhub_api_key.txt
#   FRED_API_KEY:
#     file: ./secrets/fred_api_key.txt
#   NASA_FIRMS_API_KEY:
#     file: ./secrets/nasa_firms_api_key.txt
#   LLM_API_KEY:
#     file: ./secrets/llm_api_key.txt

volumes:
  redis-data:
